  <g id="text_31">
   <text style="fill: #19334c; font: 700 26px 'DejaVu Sans'; text-anchor: start" x="63.36" y="39.6" transform="rotate(-0 63.36 39.6)">Two ways to simulate a tilting drone</text>
  </g>
  <g id="text_32">
   <text style="fill: #667e91; font: 13px 'DejaVu Sans'; text-anchor: start" x="63.36" y="71.28" transform="rotate(-0 63.36 71.28)">Both update full orientation. The difference is how rotation responds to a command.</text>
  </g>
  <g id="text_33">
   <text style="fill: #db8c35; font: 700 13px 'DejaVu Sans'; text-anchor: start" x="63.36" y="594" transform="rotate(-0 63.36 594)">YOUR PROPOSAL  |  change the planner, retain a quadrotor plant</text>
  </g>
  <g id="text_34">
   <text style="fill: #19334c; font: 11px 'DejaVu Sans'; text-anchor: start" x="63.36" y="740.52" transform="rotate(-0 63.36 740.52)">Same principle in all cases: render the achieved camera pose, rather than a level pose placed on the reference path.</text>
  </g>
  <g id="text_35">
   <text style="fill: #667e91; font: 10px 'DejaVu Sans'; text-anchor: start" x="63.36" y="766.656" transform="rotate(-0 63.36 766.656)">Conceptual architecture • The proposed linear-MPC / geometric-controller combination is not yet wired into our simulator.</text>
  </g>
